            apiKey: "AIzaSyAEmj0M8GjcuwIqCGNCmSjLVCcanSQq7xw",

            storageBucket: "kssr-vocabulary.firebasestorage.app",
            messagingSenderId: "885758836011",
            appId: "1:885758836011:web:f0a8b58cc268755931d96e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;

        // Anonymous Login
        signInAnonymously(auth).then(() => {
            console.log("Firebase Anonymous Auth successful.");
        }).catch(err => console.warn("Firebase Auth fallback active:", err));

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                loadUserData(user.uid);
            }
        });

        async function loadUserData(uid) {
            try {
                const docRef = doc(db, 'artifacts', 'bijakkata', 'users', uid, 'profile', 'data');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.userStats = { ...window.userStats, ...data };
                    updateHeaderStats();
                }
            } catch(e) {
                console.warn("Using local storage fallback.");
            }
        }

        window.saveUserData = async function() {
            if (!window.currentUser) return;
            try {
                const docRef = doc(db, 'artifacts', 'bijakkata', 'users', window.currentUser.uid, 'profile', 'data');
                await setDoc(docRef, window.userStats, { merge: true });
            } catch(e) {
                console.warn("Saved to local memory.");
            }
        }
    </script>

        // AUDIO ENGINE (Web Audio API for Sound Effects)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmOscillator = null;
        let bgmGain = null;
        let isMusicOn = false;

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            
            if (type === 'correct') {
                // Happy double ding
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now); // C5
                osc1.frequency.setValueAtTime(659.25, now + 0.1); // E5
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.3);
            } else if (type === 'wrong') {
                // Gentle soft buzz
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'tap') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            }
        }

        function toggleMusic() {
            const icon = document.getElementById('music-icon');
            if (isMusicOn) {
                if (bgmOscillator) {
                    bgmGain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
                    setTimeout(() => {
                        bgmOscillator.stop();
                        bgmOscillator = null;
                    }, 500);
                }
                isMusicOn = false;
                icon.className = 'fas fa-music text-slate-300';
            } else {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                bgmOscillator = audioCtx.createOscillator();
                bgmGain = audioCtx.createGain();
                bgmOscillator.type = 'sine';
                bgmOscillator.frequency.setValueAtTime(329.63, audioCtx.currentTime); // E4
                bgmGain.gain.setValueAtTime(0.02, audioCtx.currentTime); // Soft background level
                
                bgmOscillator.connect(bgmGain);
                bgmGain.connect(audioCtx.destination);
                bgmOscillator.start();
                isMusicOn = true;
                icon.className = 'fas fa-volume-up text-yellow-300';
            }
        }

        // SPEECH SYNTHESIS ENGINE (Soft Female English & Malaysian Malay)
        function speakWord(text, lang = 'en') {
            if (!('speechSynthesis' in window)) {
                alert("Speech synthesis is not supported in this browser.");
                return;
            }
            window.speechSynthesis.cancel(); // Stop current speech
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.85; // Slightly slower for children
            utterance.pitch = 1.2; // Soft, warmer higher female pitch
            
            if (lang === 'en') {
                utterance.lang = 'en-US';
            } else {
                utterance.lang = 'ms-MY'; // Authentic Malaysian Malay
            }

            // Attempt to select soft female voice if available
            const voices = window.speechSynthesis.getVoices();
            const targetLang = lang === 'en' ? 'en' : 'ms';
            const preferredVoice = voices.find(v => v.lang.startsWith(targetLang) && (v.name.includes('Female') || v.name.includes('Google') || v.name.includes('Natural')));
            if (preferredVoice) utterance.voice = preferredVoice;

            window.speechSynthesis.speak(utterance);
        }

        // ANTI-REPETITION & QUESTION GENERATION ENGINE
        let activeQuizState = null;

        function startQuiz(type) {
            playSound('tap');
            
            // Filter eligible words avoiding session repeats
            let pool = VOCAB_DATABASE.filter(w => !window.sessionTracker.shownWordIds.has(w.id));
            if (pool.length < 4) {
                // Reset session cache if exhausted
                window.sessionTracker.shownWordIds.clear();
                pool = VOCAB_DATABASE;
            }

            // Shuffle pool
            pool.sort(() => Math.random() - 0.5);
            const target = pool[0];
            window.sessionTracker.shownWordIds.add(target.id);

            if (type === 'en_bm' || type === 'bm_en') {
                // Pick 3 distractors
                const distractors = VOCAB_DATABASE.filter(w => w.id !== target.id)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 3);
                
                const options = [target, ...distractors].sort(() => Math.random() - 0.5);
                
                activeQuizState = {
                    type: type,
                    target: target,
                    options: options,
                    score: 0
                };
                renderQuizScreen();
            } else if (type === 'picture') {
                const distractors = VOCAB_DATABASE.filter(w => w.id !== target.id)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 3);
                const options = [target, ...distractors].sort(() => Math.random() - 0.5);
                activeQuizState = {
                    type: 'picture',
                    target: target,
                    options: options
                };
                renderPictureQuizScreen();
            } else if (type === 'spelling') {
                activeQuizState = {
                    type: 'spelling',
                    target: target,
                    userLetters: []
                };
                renderSpellingQuizScreen();
            }
        }

                        <span class="text-xs font-bold text-pink-600 bg-pink-50 px-3 py-1 rounded-full font-game">
                            Camat Gambar
                        </span>
                        <button onclick="renderGamesHub()" class="text-xs text-slate-400 hover:text-slate-600 font-game">
                            <i class="fas fa-times text-lg"></i>
                        </button>
                    </div>

                    <div class="text-center mb-6">
                        <p class="text-xs text-slate-500 font-bold uppercase">Manakah foto bagi:</p>
                        <h3 class="font-game font-bold text-3xl text-blue-600">${q.target.en} (${q.target.bm})?</h3>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-4">
                        ${q.options.map(opt => `
                            <div onclick="checkQuizAnswer('${opt.id}')" class="h-36 rounded-2xl overflow-hidden border-4 border-slate-100 hover:border-pink-500 cursor-pointer shadow card-bounce relative">
                                <img src="${opt.img}" class="w-full h-full object-cover">
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // SPELLING QUIZ ENGINE
        function renderSpellingQuizScreen() {
            const main = document.getElementById('main-content');
            const q = activeQuizState;
            const targetWord = q.target.en.toUpperCase();
            
            // Generate shuffled letter pool including required letters + distractors
            const letters = targetWord.split('');
            const extraLetters = ['A', 'E', 'I', 'O', 'U', 'R', 'S', 'T'].sort(() => Math.random() - 0.5).slice(0, 3);
            const poolLetters = [...letters, ...extraLetters].sort(() => Math.random() - 0.5);

            main.innerHTML = `
                <div class="bg-white rounded-3xl p-6 border-2 border-slate-200 shadow-xl text-center">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-bold text-amber-600 bg-amber-50 px-3 py-1 rounded-full font-game">
                            Permainan Ejaan
                        </span>
                        <button onclick="renderGamesHub()" class="text-xs text-slate-400 hover:text-slate-600 font-game">
                            <i class="fas fa-times text-lg"></i>
                        </button>
                    </div>

                    <div class="w-32 h-32 mx-auto rounded-2xl overflow-hidden mb-4 border-2 border-slate-200 shadow">
                        <img src="${q.target.img}" class="w-full h-full object-cover">
                    </div>

                    <p class="text-xs text-slate-500 font-bold mb-1">Maksud dalam BM: <span class="text-emerald-600">${q.target.bm}</span></p>
                    <h3 class="font-game font-bold text-xl text-slate-800 mb-6">Eja perkataan Inggeris ini:</h3>

                    <!-- User Construction Slots -->
                    <div id="spelling-slots" class="flex justify-center space-x-2 mb-8">
                        ${Array.from({length: targetWord.length}).map((_, i) => `
                            <div id="slot-${i}" class="w-10 h-12 border-b-4 border-amber-400 bg-amber-50 rounded-lg flex items-center justify-center font-game font-bold text-xl text-slate-800"></div>
                        `).join('')}
                    </div>

                    <!-- Available Letter Pool -->
                    <div id="letter-pool" class="flex flex-wrap justify-center gap-2 mb-6">
                        ${poolLetters.map((l, idx) => `
                            <button id="tile-${idx}" onclick="selectSpellingLetter('${l}', 'tile-${idx}', '${targetWord}')" class="w-12 h-12 bg-yellow-400 text-amber-950 font-game font-bold text-2xl rounded-xl shadow-md card-bounce border-b-4 border-yellow-500 flex items-center justify-center">
                                ${l}
                            </button>
                        `).join('')}
                    </div>

                    <button onclick="resetSpelling('${targetWord}')" class="text-xs font-game font-bold text-slate-400 hover:text-slate-600">
                        🔄 Set Semula Huruf
                    </button>
                </div>
            `;
        }

        function selectSpellingLetter(letter, tileId, targetWord) {
            playSound('tap');
            const tile = document.getElementById(tileId);
            if (tile.classList.contains('tile-selected')) return;

            tile.classList.add('tile-selected');
            activeQuizState.userLetters.push({ letter, tileId });

            // Update slot
            const slotIndex = activeQuizState.userLetters.length - 1;
            const slot = document.getElementById(`slot-${slotIndex}`);
            if (slot) slot.innerText = letter;

            // Check if full
            if (activeQuizState.userLetters.length === targetWord.length) {
                const built = activeQuizState.userLetters.map(x => x.letter).join('');
                if (built === targetWord) {
                    playSound('correct');
                    window.userStats.stars += 5;
                    showFeedbackModal(true, `Ejaan Tepat sekali! ⭐ +5 Bintang`);
                } else {
                    playSound('wrong');
                    showFeedbackModal(false, `Ejaan belum tepat. Jawapan: ${targetWord}`);
                }
            }
        }

        function resetSpelling(targetWord) {
            playSound('tap');
            activeQuizState.userLetters = [];
            renderSpellingQuizScreen();
        }

        // MATCHING PAIRS GAME
        function startMatchingGame() {
            playSound('tap');
            const main = document.getElementById('main-content');
            
            // Pick 4 random words
            const sample = [...VOCAB_DATABASE].sort(() => Math.random() - 0.5).slice(0, 4);
            const cards = [];
            sample.forEach(w => {
                cards.push({ id: w.id, text: w.en, type: 'en' });
                cards.push({ id: w.id, text: w.bm, type: 'bm' });
            });
            cards.sort(() => Math.random() - 0.5);

            let selectedFirst = null;

            main.innerHTML = `
                <div class="bg-white rounded-3xl p-6 border-2 border-slate-200 shadow-xl">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-bold text-cyan-600 bg-cyan-50 px-3 py-1 rounded-full font-game">
                            Padanan Pasangan
                        </span>
                        <button onclick="renderGamesHub()" class="text-xs text-slate-400 hover:text-slate-600 font-game">
                            <i class="fas fa-times text-lg"></i>
                        </button>
                    </div>

                    <p class="text-xs text-slate-500 font-bold text-center mb-6">Padankan perkataan Bahasa Inggeris dengan Bahasa Melayu!</p>

                    <div class="grid grid-cols-2 gap-3" id="matching-grid">
                        ${cards.map((c, idx) => `
                            <button id="match-card-${idx}" onclick="handleMatchingClick(${idx}, '${c.id}', '${c.text}')" class="h-20 bg-cyan-50 border-2 border-cyan-200 hover:border-cyan-400 rounded-2xl font-game font-bold text-base text-slate-700 shadow flex items-center justify-center p-2 card-bounce">
                                ${c.text}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            window.matchState = { cards, selectedFirst: null, solved: 0 };
        }

        function handleMatchingClick(idx, id, text) {
            playSound('tap');
            const st = window.matchState;
            const btn = document.getElementById(`match-card-${idx}`);

            if (btn.classList.contains('bg-emerald-200')) return; // solved

            if (!st.selectedFirst) {
                st.selectedFirst = { idx, id, btn };
                btn.classList.remove('bg-cyan-50');
                btn.classList.add('bg-yellow-200', 'border-yellow-400');
            } else {
                if (st.selectedFirst.idx === idx) return;

                if (st.selectedFirst.id === id) {
                    // Match found!
                    playSound('correct');
                    st.selectedFirst.btn.className = "h-20 bg-emerald-100 border-2 border-emerald-400 rounded-2xl font-game font-bold text-base text-emerald-800 shadow flex items-center justify-center p-2 pointer-events-none opacity-80";
                    btn.className = "h-20 bg-emerald-100 border-2 border-emerald-400 rounded-2xl font-game font-bold text-base text-emerald-800 shadow flex items-center justify-center p-2 pointer-events-none opacity-80";
                    st.solved += 1;
                    st.selectedFirst = null;

                    if (st.solved === 4) {
                        playSound('fanfare');
                        window.userStats.stars += 10;
                        showFeedbackModal(true, "Hebat! Semua Padanan Berjaya! ⭐ +10 Bintang");
                    }
                } else {
                    // Wrong pair
                    playSound('wrong');
                    btn.classList.add('bg-red-200');
                    setTimeout(() => {
                        st.selectedFirst.btn.className = "h-20 bg-cyan-50 border-2 border-cyan-200 hover:border-cyan-400 rounded-2xl font-game font-bold text-base text-slate-700 shadow flex items-center justify-center p-2 card-bounce";
                        btn.className = "h-20 bg-cyan-50 border-2 border-cyan-200 hover:border-cyan-400 rounded-2xl font-game font-bold text-base text-slate-700 shadow flex items-center justify-center p-2 card-bounce";
                        st.selectedFirst = null;
                    }, 500);
                }
            }
        }

        // FEEDBACK MODAL
        function showFeedbackModal(isSuccess, msg) {
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in";
            modal.innerHTML = `
                <div class="bg-white rounded-3xl max-w-xs w-full p-6 text-center shadow-2xl border-4 ${isSuccess ? 'border-emerald-300' : 'border-red-300'}">
                    <div class="text-5xl mb-3">${isSuccess ? '🎉' : '💡'}</div>
                    <h3 class="font-game font-bold text-xl ${isSuccess ? 'text-emerald-600' : 'text-red-600'} mb-2">
                        ${isSuccess ? 'Tahniah!' : 'Sikit Lagi!'}
                    </h3>
                    <p class="text-sm font-semibold text-slate-600 mb-6">${msg}</p>
                    <button onclick="closeFeedbackModal(this)" class="w-full py-3 ${isSuccess ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-slate-700 hover:bg-slate-800'} text-white font-game font-bold rounded-xl shadow-lg">
                        Teruskan
                    </button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function closeFeedbackModal(btn) {
            playSound('tap');
            const modal = btn.closest('.fixed');
            if (modal) modal.remove();
            renderGamesHub();
        }

        // 4. PROGRESS & SCORE HISTORY
        function renderProgress() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="bg-white rounded-3xl p-6 border-2 border-slate-200 shadow-xl mb-6">
                    <h2 class="font-game font-bold text-2xl text-slate-800 mb-1">Prestasi Pembelajaran</h2>
                    <p class="text-xs text-slate-500 mb-6">Jejak kemajuan penguasaan kosa kata KSSR adik!</p>

                    <!-- Star Badges Row -->
                    <div class="flex items-center justify-around bg-amber-50 border border-amber-200 p-4 rounded-2xl mb-6">
                        <div class="text-center">
                            <span class="text-3xl">🥇</span>
                            <div class="text-[10px] font-game font-bold text-amber-800 mt-1">Pembaca Bintang</div>
                        </div>
                        <div class="text-center">
                            <span class="text-3xl">🔥</span>
                            <div class="text-[10px] font-game font-bold text-amber-800 mt-1">3 Hari Streak</div>
                        </div>
                        <div class="text-center">
                            <span class="text-3xl">🧠</span>
                            <div class="text-[10px] font-game font-bold text-amber-800 mt-1">Pakar Ejaan</div>
                        </div>
                    </div>

                    <!-- Progress Bars -->
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between text-xs font-game font-bold mb-1">
                                <span class="text-slate-600">English → Bahasa Melayu</span>
                                <span class="text-blue-600">${window.userStats.enToBmAccuracy}%</span>
                            </div>
                            <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                                <div class="bg-blue-500 h-full rounded-full" style="width: ${window.userStats.enToBmAccuracy}%"></div>
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between text-xs font-game font-bold mb-1">
                                <span class="text-slate-600">Bahasa Melayu → English</span>
                                <span class="text-emerald-600">${window.userStats.bmToEnAccuracy}%</span>
                            </div>
                            <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                                <div class="bg-emerald-500 h-full rounded-full" style="width: ${window.userStats.bmToEnAccuracy}%"></div>
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between text-xs font-game font-bold mb-1">
                                <span class="text-slate-600">Ketepatan Ejaan</span>
                                <span class="text-amber-600">${window.userStats.spellingAccuracy}%</span>
                            </div>
                            <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                                <div class="bg-amber-500 h-full rounded-full" style="width: ${window.userStats.spellingAccuracy}%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // 5. MY WORDS / FAVOURITES & SEARCH
        let searchQuery = '';
        function renderWords() {
            const main = document.getElementById('main-content');
            
            const filtered = VOCAB_DATABASE.filter(w => {
                const matchSearch = w.en.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    w.bm.toLowerCase().includes(searchQuery.toLowerCase());
                return matchSearch;
            });

            main.innerHTML = `
                <div class="mb-4">
                    <input type="text" id="search-input" value="${searchQuery}" oninput="handleSearch(this.value)" placeholder="🔍 Cari perkataan (cth: Car, Kucing)..." class="w-full bg-white border-2 border-slate-200 rounded-2xl py-3 px-4 font-game text-sm focus:border-blue-500 focus:outline-none shadow-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    ${filtered.map(w => {
                        const isFav = window.userStats.favourites.includes(w.id);
                        return `
                            <div class="bg-white p-4 rounded-2xl border-2 border-slate-100 shadow-sm flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <img src="${w.img}" class="w-14 h-14 rounded-xl object-cover">
                                    <div>
                                        <h4 class="font-game font-bold text-base text-slate-800">${w.en}</h4>
                                        <p class="text-xs font-semibold text-emerald-600">${w.bm}</p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <button onclick="speakWord('${w.en}', 'en')" class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-xs">🔊</button>
                                    <button onclick="toggleFav('${w.id}')" class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-xs">
                                        <i class="${isFav ? 'fas fa-heart text-red-500' : 'far fa-heart text-slate-300'}"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function handleSearch(val) {
            searchQuery = val;
            renderWords();
        }

        // 6. PARENT SECTION & MATH GATE
        let mathGateAns = 0;
        function openParentGate() {
            const num1 = Math.floor(Math.random() * 10) + 2;
            const num2 = Math.floor(Math.random() * 10) + 2;
            mathGateAns = num1 + num2;

            document.getElementById('math-question').innerText = `${num1} + ${num2} = ?`;
            document.getElementById('math-answer').value = '';
            document.getElementById('parent-modal').classList.remove('hidden');
        }

        function closeParentGate() {
            playSound('tap');
            document.getElementById('parent-modal').classList.add('hidden');
        }

        function verifyParentGate() {
            playSound('tap');
            const userAns = parseInt(document.getElementById('math-answer').value);
            if (userAns === mathGateAns) {
                document.getElementById('parent-modal').classList.add('hidden');
                renderParentDashboard();
            } else {
                alert("Jawapan tidak tepat. Sila cuba lagi.");
            }
        }

        function renderParentDashboard() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="bg-white rounded-3xl p-6 border-2 border-purple-200 shadow-xl mb-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-game font-bold text-2xl text-purple-900">Analisis Perkembangan Murid</h2>
                        <span class="bg-purple-100 text-purple-700 text-xs font-bold px-3 py-1 rounded-full font-game">Mod Ibu Bapa</span>
                    </div>

                    <p class="text-xs text-slate-500 mb-6">Laporan ini memantau secara terperinci prestasi kosa kata anak anda.</p>

                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                            <span class="text-xs text-slate-500 font-bold">Masa Belajar</span>
                            <div class="font-game font-bold text-xl text-slate-800">${window.userStats.timeSpentMinutes} Minit</div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                            <span class="text-xs text-slate-500 font-bold">Jumlah Kuis Dijawab</span>
                            <div class="font-game font-bold text-xl text-slate-800">${window.userStats.quizAttempts} Percubaan</div>
                        </div>
                    </div>

                    <h4 class="font-game font-bold text-sm text-slate-800 mb-3">Senarai Kata Perlu Perhatian (Weak Words):</h4>
                    <div class="space-y-2 mb-6">
                        ${window.userStats.weakWords.map(id => {
                            const w = VOCAB_DATABASE.find(x => x.id === id);
                            if (!w) return '';
                            return `
                                <div class="flex items-center justify-between p-3 bg-red-50 border border-red-100 rounded-xl text-xs font-bold">
                                    <span class="text-red-900">${w.en} (${w.bm})</span>
                                    <span class="text-red-500">Tahun ${w.standard} • ${w.category}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function startDailyChallenge() {
            playSound('tap');
            startQuiz('en_bm');
        }

        function startWeakWordsGame() {
            playSound('tap');
            startQuiz('en_bm');
        }

        // INITIAL LAUNCH
        window.onload = function() {
            switchTab('home');
        };
    </script>
</body>
</html>
